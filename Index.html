<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>IMC Camera Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #startCamera {
      background: #2563eb;
      color: white;
    }

    #stopCamera {
      background: #6b7280;
      color: white;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fef3c7;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      background: black;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📦 Inventory Mobile Collector</h1>

  <p>Android Camera Test</p>

  <button id="startCamera">
    📷 START CAMERA
  </button>

  <button id="stopCamera">
    ■ STOP CAMERA
  </button>

  <div id="status">
    Camera not started
  </div>

  <video id="camera" autoplay playsinline></video>

</div>

<script>

let cameraStream = null;

const startButton = document.getElementById("startCamera");
const stopButton = document.getElementById("stopCamera");
const video = document.getElementById("camera");
const status = document.getElementById("status");

startButton.addEventListener("click", async function () {

  try {

    status.textContent = "Requesting camera permission...";

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: false
    });

    video.srcObject = cameraStream;

    status.textContent = "🟢 Camera is working";

  } catch (error) {

    console.error(error);

    status.textContent =
      "🔴 Camera failed: " + error.name;

    alert(
      "Camera could not start.\n\n" +
      "Error: " + error.name
    );

  }

});


stopButton.addEventListener("click", function () {

  if (cameraStream) {

    cameraStream.getTracks().forEach(function(track) {
      track.stop();
    });

    cameraStream = null;
    video.srcObject = null;

    status.textContent = "Camera stopped";

  }

});

</script>

</body>
</html>
